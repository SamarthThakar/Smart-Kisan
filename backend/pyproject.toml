[project]
name = "smart-kisan"
version = "1.0.0"
description = "AI-Powered Smart Farming Assistant — Backend API"
readme = "README.md"
requires-python = ">=3.11"

dependencies = [
    "fastapi==0.115.0",
    "uvicorn[standard]==0.30.6",
    "python-multipart==0.0.9",
    "python-jose[cryptography]==3.3.0",
    "passlib[bcrypt]==1.7.4",
    "sqlalchemy==2.0.35",
    "aiosqlite==0.20.0",
    "alembic==1.13.3",
    "pydantic==2.9.2",
    "pydantic-settings==2.5.2",
    "httpx==0.27.2",
    "pillow==10.4.0",
    "numpy==1.26.4",
    "scikit-learn==1.5.2",
    "joblib==1.4.2",
    # tensorflow-cpu avoids tensorflow-io-gcs-filesystem which has no Windows wheels
    "tensorflow-cpu==2.17.0",
    "google-generativeai==0.8.2",
    "chromadb==0.5.7",
    "python-dotenv==1.0.1",
    "slowapi==0.1.9",
    "aiofiles==24.1.0",
]

[tool.uv]
package = false
override-dependencies = [
    "tensorflow-io-gcs-filesystem<=0.31.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]
